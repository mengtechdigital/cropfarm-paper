# ============================================================
#  CropFarm  —  config.yml
# ============================================================
#
#  HOW CROPS WORK
#  --------------
#  1. Craft seeds using the recipe defined per crop below.
#  2. Right-click farmland while holding seeds to plant.
#  3. The crop grows on a TIMER (light/water don't matter).
#     Bone meal is BLOCKED for balance.
#  4. Break the crop when fully grown to receive the output
#     plus one returned seed (so the cycle continues).
#  5. Breaking early returns the seed — nothing is lost.
#  6. Harvesting fully-grown crops drops XP orbs based on tier.
#
#  TIERS
#  -----
#  Each crop belongs to a tier. Tiers define defaults for grow
#  time, per-player planting cap, and XP drops per harvest. A
#  crop can override any of these inline.
#
#  PER-PLAYER CAP
#  --------------
#  Players can plant up to `max-per-player` crops of a given
#  type at one time. 0 = unlimited. Op perm `cropfarm.bypass-cap`
#  ignores the cap entirely.
#
#  WEIGHTED OUTPUTS (optional)
#  ---------------------------
#  Instead of `output:` + `min-drops:`/`max-drops:`, define
#  `outputs:` as a list of `{ item, weight, min, max }` for
#  random-color wool, dye crops, rare-proc loot tables, etc.
#
#  EXTRA CROP FILES
#  ----------------
#  You can split crops across files: drop any *.yml file into
#  `plugins/CropFarm/crops/`. Each file's `crops:` section is
#  merged in load order (alphabetical). Last write wins on dupes.
#
#  COLOR CODES
#  -----------
#  §0 black  §1 dk blue §2 dk green §3 dk aqua §4 dk red §5 purple
#  §6 gold   §7 gray    §8 dk gray  §9 blue    §a green  §b aqua
#  §c red    §d pink    §e yellow   §f white   §l bold   §o italic
#  §r reset
# ============================================================

settings:
  # Show particles when planting and harvesting.
  particles: true

  # Play sounds when planting and harvesting.
  sounds: true

  # If a player breaks a crop that isn't fully grown,
  # return the seed to them instead of losing it.
  return-seed-on-early-break: true

  # If false (default), bone meal does NOT advance these crops.
  # Set true to allow vanilla bonemeal-rushing.
  allow-bonemeal: false

  # If true (default), harvested items + XP go straight into the
  # player's inventory / XP bar — no dropped item entities, no XP
  # orbs. Massively reduces server entity load on big farms.
  # Set false for the classic dropped-item behavior.
  direct-to-inventory: true

  # ---- Floating nametag above each planted crop ----
  nametag-enabled: true
  nametag-show-progress: true            # show stage e.g. (3/7)
  nametag-view-range-blocks: 20          # how close before it appears (4–64)
  nametag-text:        "{crop} §7§o({stage}/{max})"
  nametag-text-ready:  "{crop} §a§l✓ Ready!"

  # ---- Chat / action messages ----
  plant-message:           "§a✦ {crop} §aplanted! Grow time will pass automatically..."
  harvest-message:         "§b✦ Harvested §f{amount}x {output}§b!"
  early-break-message:     "§e⚠ Not fully grown yet! §7({stage}/{max}) Seed returned."
  bonemeal-blocked-message: "§c⚠ Magic seeds resist bone meal — they grow on their own time."
  cap-reached-message:     "§c⚠ You've planted the maximum §f{cap}§c {crop}§c. Harvest some first."


# ============================================================
#  TIER DEFINITIONS
# ============================================================
#
#  Every crop has `tier: <id>`. The tier supplies defaults for
#  grow-time-seconds, max-per-player, xp-min, xp-max — but a
#  crop can override any of those fields individually.
#
#  Suggested philosophy: common = bulk casual farming, epic =
#  endgame trickle. Lower caps for rarer items keeps the in-game
#  economy sane and prevents 10000-diamond AFK setups.
# ============================================================

tiers:
  common:
    grow-time-seconds: 180     # 3 min
    max-per-player: 1000
    xp-min: 0
    xp-max: 1
    color: "§7"
  mid:
    grow-time-seconds: 360     # 6 min
    max-per-player: 256
    xp-min: 1
    xp-max: 3
    color: "§e"
  rare:
    grow-time-seconds: 720     # 12 min
    max-per-player: 64
    xp-min: 3
    xp-max: 7
    color: "§b"
  epic:
    grow-time-seconds: 1500    # 25 min
    max-per-player: 32
    xp-min: 7
    xp-max: 15
    color: "§5"


# ============================================================
#  CROP DEFINITIONS
# ============================================================
#
#  Fields per crop:
#    display-name       — Name shown on the seed item AND on the floating nametag.
#    lore               — Tooltip lines on the seed item.
#    recipe-input       — Material required to craft seeds.
#    recipe-yield       — How many seeds the recipe produces (1–64).
#    output             — Material dropped when harvested. (Single-output form.)
#    min-drops, max-drops — Drop range when fully grown.
#    outputs            — (Optional) Weighted list; replaces output/min-drops/max-drops.
#                         Each entry: { item: <MAT>, weight: <int>, min: <int>, max: <int> }
#    custom-model-data  — For optional resource pack textures (0 = vanilla).
#    tier               — Tier id from above (sets grow-time / cap / xp defaults).
#    grow-time-seconds  — Optional override of the tier's grow time.
#    max-per-player     — Optional override of the tier's planting cap (0 = unlimited).
#    xp-min, xp-max     — Optional overrides for XP drop range on harvest.
# ============================================================

