# ============================================================
#  CropFarm — crafting essentials
# ============================================================
#  Bulk crafting bottlenecks. All trivially craftable from primary
#  resources, but in volume the smelting / chopping / planking
#  cycles get tedious for casual builders.
# ============================================================

crops:

