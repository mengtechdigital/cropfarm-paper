# ============================================================
#  CropFarm — flowers
# ============================================================
#  Each flower is a single-color crop. For a "random flower" pick,
#  see crops/dyes.yml — flowers craft into dyes, and the dye seed
#  yields a weighted random color.
#
#  The 1.20+ Sniffer-gated flowers (torchflower, pitcher_plant) are
#  here as the actual flower blocks; the seeds (torchflower_seeds,
#  pitcher_pod) live in crops/sniffer.yml.
# ============================================================

crops:

  dandelion:
    display-name: "§e✦ Dandelion Seed"
    recipe-input: DANDELION
    recipe-yield: 4
    output: DANDELION
    min-drops: 2
    max-drops: 4
    tier: common

