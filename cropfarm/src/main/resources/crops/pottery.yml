# ============================================================
#  CropFarm — pottery sherds (23 separate seeds, one per pattern)
# ============================================================
#  Each sherd is its own seed so players grow exactly the pattern
#  they need for decorated pots. Recipe input is the matching sherd.
#
#  DISABLED BY DEFAULT — pottery sherds are archaeology loot
#  (suspicious sand / gravel) and farming them removes the whole
#  brush-the-dirt minigame. Set `enabled: true` to re-enable.
# ============================================================

enabled: false

crops:

  angler_pottery_sherd:
    display-name: "§6✦ Angler Sherd Seed"
    recipe-input: ANGLER_POTTERY_SHERD
