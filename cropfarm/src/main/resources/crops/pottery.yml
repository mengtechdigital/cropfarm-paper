# ============================================================
#  CropFarm — pottery sherds (weighted random pattern)
# ============================================================
#  One "pottery seed" yields a random pattern from the 22 sherd
#  variants (1.20–1.21). Use these to decorate pots — combine 4
#  sherds + 4 bricks (or just bricks) at a crafter to make a
#  decorated pot with the chosen patterns.
# ============================================================

crops:

  pottery_sherd:
    display-name: "§6✦ Pottery Sherd Seed"
    lore:
      - "§7Random sherd pattern §8(weighted)§7."
      - "§7Replaces §6brushing suspicious sand/gravel§7."
