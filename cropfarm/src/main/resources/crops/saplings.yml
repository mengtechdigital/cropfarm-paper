# ============================================================
#  CropFarm — saplings (wood farming)
# ============================================================
#  Wood is the universal building bottleneck. Each crop yields
#  saplings rather than logs so casual players still need to plant
#  and grow trees the vanilla way — the crop just removes the
#  scavenging step.
# ============================================================

