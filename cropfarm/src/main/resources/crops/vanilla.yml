# ============================================================
#  CropFarm — foraging items (vanilla growables that are tedious)
# ============================================================
#  Items vanilla can produce but the process is RNG-driven or
#  biome-locked: apple from oak-leaf decay, sea pickles from warm
#  reefs, chorus fruit from End cities, glow berries from lush caves.
# ============================================================

crops:

  apple:
    display-name: "§c✦ Apple Seed"
    lore:
      - "§7Skip the §coak-leaf decay§7 lottery."
    recipe-input: APPLE
    recipe-yield: 4
    output: APPLE
    min-drops: 2
    max-drops: 4
    tier: common

  sweet_berries:
    display-name: "§c✦ Sweet Berry Seed"
    lore:
      - "§7No bush, no fall damage."
    recipe-input: SWEET_BERRIES
    recipe-yield: 4
    output: SWEET_BERRIES
    min-drops: 3
    max-drops: 5
    tier: common

  glow_berries:
