# ============================================================
#  CropFarm — vanilla growables that are tedious or RNG-driven
# ============================================================
#  Items vanilla can grow but the process is painful: apple drops
#  from oak-leaf decay RNG, sea pickles only spawn in warm reefs,
#  chorus fruit only in End cities, glow berries hide in lush caves.
# ============================================================

crops:

  apple:
    display-name: "§c✦ Apple Seed"
    lore:
      - "§7Skip the §coak-leaf decay§7 lottery."
    recipe-input: APPLE
    recipe-yield: 4
    output: APPLE
    min-drops: 2
    max-drops: 4
    tier: common
    grow-time-seconds: 240

  sweet_berries:
    display-name: "§c✦ Sweet Berry Seed"
    lore:
      - "§7No bush, no fall damage."
    recipe-input: SWEET_BERRIES
    recipe-yield: 4
    output: SWEET_BERRIES
    min-drops: 3
    max-drops: 5
    tier: common
    grow-time-seconds: 180

  glow_berries:
    display-name: "§e✦ Glow Berry Seed"
    lore:
