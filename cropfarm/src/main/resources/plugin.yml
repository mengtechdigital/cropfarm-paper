name: CropFarm
version: 1.7.1
main: com.cropfarm.CropFarm
api-version: '1.21'
description: Custom seed/crop system with configurable yields.
author: Meng Tech LLC

commands:
  cropfarm:
    description: Open the CropFarm menu, reload config, or give seeds.
    usage: /cropfarm [menu|reload|give <crop> [amount] [player]]
    aliases: [cf]
  cropfarmreload:
    description: Reload CropFarm config.yml.
    usage: /cropfarmreload
    permission: cropfarm.reload
  cropfarmgive:
    description: Give a CropFarm seed to a player.
    usage: /cropfarmgive <crop> [amount] [player]
    permission: cropfarm.give

permissions:
  cropfarm.menu:
    description: Allows opening the /cropfarm menu.
    default: true
  cropfarm.reload:
    description: Allows reloading CropFarm config.
    default: op
  cropfarm.give:
    description: Allows giving CropFarm seeds.
    default: op
  cropfarm.bypass-cap:
    description: Bypass the per-player planting cap on every crop.
    default: op
